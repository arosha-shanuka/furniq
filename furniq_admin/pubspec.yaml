name: furniq_admin
description: Furniq Admin Panel - Web dashboard for managing products, categories, and assets
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7

  # State Management
  provider: ^6.1.1

  # UI & Images
  cached_network_image: ^3.3.0
  file_picker: ^8.0.0
  data_table_2: ^2.5.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2

  # Icons
  cupertino_icons: ^1.0.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
